quiz:
  - q: What does this print?
    code: |
      from collections import defaultdict
      d = defaultdict(list)
      print(d.get('a'), 'a' in d)
      d['b']
      print(dict(d))
    options:
      - "`[] True` then `{'a': [], 'b': []}`"
      - "`None False` then `{'b': []}`"
      - "`None False` then `{}`"
      - "`[] False` then `{'b': []}`"
    answer: 1
    explain: |
      Only the subscript lookup `d[key]` calls the default factory (via `__missing__`), and it **stores** the new value. `.get` and `in` never trigger the factory, so `'a'` is never created, but merely evaluating `d['b']` inserts `'b': []`.

  - q: Which of these is a correct way to create a `defaultdict` whose missing keys start as empty lists?
    options:
      - "`defaultdict([])`"
      - "`defaultdict(list())`"
      - "`defaultdict(list)`"
      - "`defaultdict(default=[])`"
    answer: 2
    explain: |
      The first argument must be a **callable** that takes no arguments. `list` is such a callable, and each call returns a new empty list. `[]` and `list()` are list *objects*, not callables, so they raise a `TypeError`.

  - q: What does this print?
    code: |
      from collections import Counter
      c = Counter('banana')
      print(c['z'], 'z' in c, len(c))
    options:
      - "`0 False 3`"
      - "`0 True 4`"
      - "`None False 3`"
      - "A `KeyError`"
    answer: 0
    explain: |
      A `Counter` returns `0` for a missing key **without inserting it** (unlike a `defaultdict`). `'banana'` has three distinct letters, so `len(c)` stays 3.

  - q: What does this print?
    code: |
      from collections import Counter
      c1 = Counter(a=3, b=1)
      c2 = Counter(a=1, b=2)
      print(c1 - c2)
      c1.subtract(c2)
      print(c1)
    options:
      - "`Counter({'a': 2, 'b': -1})` twice"
      - "`Counter({'a': 2})` twice"
      - "`Counter({'a': 2})` then `Counter({'a': 2, 'b': -1})`"
      - "`Counter({'a': 2, 'b': -1})` then `Counter({'a': 2})`"
    answer: 2
    explain: |
      The `-` operator returns a new counter and drops counts that end up zero or negative. `subtract` works in place and keeps negative counts.

  - q: What does this print? (Python 3.10+)
    code: |
      from collections import Counter
      stock = Counter(eggs=6, milk=1, flour=2)
      recipe = Counter(eggs=2, flour=2)
      print(recipe <= stock, stock.total())
    options:
      - "`False 3`"
      - "`True 3`"
      - "`False 9`"
      - "`True 9`"
    answer: 3
    explain: |
      Since 3.10, `<=` on counters is **multiset inclusion**: every count in `recipe` is at most the matching count in `stock`. `total()` adds up all the counts: 6 + 1 + 2 = 9.

  - q: What does this print?
    code: |
      from collections import Counter
      print(Counter(a=2, b=0) == Counter(a=2))
      print(list(Counter(a=2, b=0).elements()))
    options:
      - "`True` then `['a', 'a']`"
      - "`False` then `['a', 'a']`"
      - "`True` then `['a', 'a', 'b']`"
      - "`False` then `['a', 'a', 'b']`"
    answer: 0
    explain: |
      Since Python 3.10, missing elements count as zero in counter comparisons, so a zero count doesn't make two counters unequal. `elements()` repeats each key by its count and skips counts below 1.

  - q: What does this print?
    code: |
      from collections import OrderedDict
      a = OrderedDict(x=1, y=2)
      b = OrderedDict(y=2, x=1)
      c = {'y': 2, 'x': 1}
      print(a == b, a == c, b == c)
    options:
      - "`True True True`"
      - "`False False True`"
      - "`False True True`"
      - "`False False False`"
    answer: 2
    explain: |
      Two `OrderedDict`s must have the same items **in the same order** to be equal. Comparing an `OrderedDict` with a plain `dict` ignores order, so both of those comparisons are `True`.

  - q: What does this print?
    code: |
      from collections import OrderedDict
      d = OrderedDict.fromkeys('abcd')
      d.move_to_end('b')
      d.move_to_end('d', last=False)
      d.popitem(last=False)
      print(''.join(d))
    options:
      - "`acb`"
      - "`cdb`"
      - "`dacb`"
      - "`acd`"
    answer: 0
    explain: |
      `a b c d` becomes `a c d b` after moving `b` to the end, then `d a c b` after moving `d` to the front. `popitem(last=False)` removes the first item, `d`, leaving `a c b`.

  - q: Since Python 3.7, which of these does a plain `dict` **not** offer directly?
    options:
      - Guaranteed insertion order
      - "`reversed(d)`"
      - "`popitem()` removing the most recently inserted item"
      - Moving an existing key to the front in constant time
    answer: 3
    explain: |
      Plain dicts keep insertion order (3.7+), support `reversed()` (3.8+) and pop the last item with `popitem()`. There's no way to put a key at the **front** without re-inserting the others, which `OrderedDict.move_to_end(key, last=False)` does in O(1).

  - q: What does this print?
    code: |
      from collections import ChainMap
      d1 = {'a': 1}
      d2 = {'a': 10, 'b': 20}
      cm = ChainMap(d1, d2)
      cm['b'] = 99
      del cm['a']
      print(cm['a'], cm['b'], d2)
    options:
      - "`10 99 {'a': 10, 'b': 20}`"
      - "`10 99 {'a': 10, 'b': 99}`"
      - "A `KeyError` on `cm['a']`"
      - "`1 20 {'a': 10, 'b': 99}`"
    answer: 0
    explain: |
      All writes go to the **first** map: `cm['b'] = 99` adds `'b'` to `d1`, and `del cm['a']` removes `'a'` from `d1`. `d2` is never touched, so its `'a': 10` now shows through.

  - q: How does a `ChainMap` lookup differ from `{**d1, **d2}`?
    options:
      - "They behave the same: the last mapping wins"
      - "`ChainMap` returns the value from the **first** mapping that has the key, and doesn't copy the data"
      - "`ChainMap` raises an error if a key appears in more than one mapping"
      - "`ChainMap` merges values that appear in several mappings into a list"
    answer: 1
    explain: |
      In `{**d1, **d2}` later dictionaries overwrite earlier ones, and everything is copied. A `ChainMap` searches its maps in order, returns the first match and keeps references to the originals, so it's a live view.

  - q: |
      `class D(dict)` overrides `__setitem__` to reject negative values. Which statement still stores `-1` without any error?
    options:
      - "`d['x'] = -1`"
      - "`d.update(x=-1)`"
      - "Neither, both call `__setitem__`"
      - "Both store it"
    answer: 1
    explain: |
      `dict` is written in C, and its `update` (like its constructor, `setdefault` and others) writes to the hash table directly without calling an overridden `__setitem__`. Only `d[key] = value` uses the override. `UserDict` routes every method through the dunder methods, which avoids this.

exercises:
  - id: group-by
    title: Group records with defaultdict
    prompt: |
      Write `group_by(records, key)` that groups a list of dictionaries by the value of `key`.

      It returns a **plain** `dict` (not a `defaultdict`) mapping each key value to a list of the matching records, in their original order. Records that don't have the key go under `None`. Use a `defaultdict` while building the result.
    starter: |
      from collections import defaultdict

      def group_by(records, key):
          groups = defaultdict(list)
          # your code here
          return groups
    tests: |
      people = [
          {'name': 'ann', 'city': 'Paris'},
          {'name': 'bob', 'city': 'Rome'},
          {'name': 'cat'},
          {'name': 'dan', 'city': 'Paris'},
      ]

      def test_groups():
          """records are grouped by the key value, in order"""
          g = group_by(people, 'city')
          assert [p['name'] for p in g.get('Paris', [])] == ['ann', 'dan'], f"Paris group: {g.get('Paris')}"
          assert [p['name'] for p in g.get('Rome', [])] == ['bob']

      def test_missing_key():
          """records without the key go under None"""
          g = group_by(people, 'city')
          assert None in g, "no None group"
          assert [p['name'] for p in g[None]] == ['cat']

      def test_plain_dict():
          """the result is a plain dict, so unknown keys raise KeyError"""
          g = group_by(people, 'city')
          assert type(g) is dict, f"returned {type(g).__name__}"
          try:
              g['Berlin']
          except KeyError:
              pass
          else:
              raise AssertionError("looking up an unknown group did not raise KeyError")

      def test_empty():
          """an empty list gives an empty dict"""
          assert group_by([], 'city') == {}
    solution: |
      from collections import defaultdict

      def group_by(records, key):
          groups = defaultdict(list)
          for record in records:
              groups[record.get(key)].append(record)
          return dict(groups)
    hints:
      - "`record.get(key)` returns `None` when the key is missing, which is exactly the group name you need."
      - "Convert at the end with `dict(groups)` so callers get a normal dictionary."

  - id: missing-letters
    title: Can you spell it?
    prompt: |
      In a word game you hold some letter tiles. Write two functions using `Counter`:

      - `can_spell(word, tiles)` returns `True` if `word` can be built from the letters in the string `tiles` (each tile used at most once).
      - `missing_letters(word, tiles)` returns a **plain dict** of the letters you'd still need and how many of each, for example `{'p': 1}`. It's empty if the word can be spelled.

      Treat upper and lower case the same.
    starter: |
      from collections import Counter

      def can_spell(word, tiles):
          return set(word.lower()) <= set(tiles.lower())

      def missing_letters(word, tiles):
          pass
    tests: |
      def test_can_spell_simple():
          """a word using available tiles can be spelled"""
          assert can_spell('cab', 'abcd') is True

      def test_counts_matter():
          """repeated letters need repeated tiles"""
          assert can_spell('apple', 'aple') is False, "'apple' needs two p tiles"
          assert can_spell('apple', 'pplae') is True

      def test_case_insensitive():
          """case is ignored"""
          assert can_spell('Bob', 'obb') is True

      def test_missing():
          """missing_letters reports what is lacking"""
          assert missing_letters('apple', 'aple') == {'p': 1}
          assert missing_letters('banana', 'ban') == {'a': 2, 'n': 1}

      def test_missing_none():
          """missing_letters is empty when the word can be spelled"""
          result = missing_letters('cab', 'abcd')
          assert result == {} and type(result) is dict, f"got {result!r}"
    solution: |
      from collections import Counter

      def can_spell(word, tiles):
          return Counter(word.lower()) <= Counter(tiles.lower())

      def missing_letters(word, tiles):
          return dict(Counter(word.lower()) - Counter(tiles.lower()))
    hints:
      - "Sets lose the counts. Compare two `Counter` objects instead: since Python 3.10, `c1 <= c2` means every count in `c1` fits in `c2`."
      - "`Counter(word) - Counter(tiles)` keeps only the positive differences, which are exactly the missing letters."

  - id: recent-items
    title: Recently viewed with OrderedDict
    prompt: |
      Write a class `Recent` that tracks the most recently viewed items, keeping at most `capacity` of them.

      - `view(item)` records that `item` was viewed. Viewing an item that is already tracked makes it the most recent. When there are more than `capacity` items, the least recently viewed one is dropped.
      - `items()` returns a list of the tracked items, **most recent first**.
      - `len(recent)` gives the number of tracked items.

      Use an `OrderedDict` (the values don't matter, so store `None`).
    starter: |
      from collections import OrderedDict

      class Recent:
          def __init__(self, capacity):
              self.capacity = capacity
              self._data = OrderedDict()

          def view(self, item):
              self._data[item] = None

          def items(self):
              return list(self._data)

          def __len__(self):
              return len(self._data)
    tests: |
      def test_order():
          """most recent item comes first"""
          r = Recent(5)
          for x in 'abc':
              r.view(x)
          assert r.items() == ['c', 'b', 'a'], f"got {r.items()}"

      def test_review_moves_to_front():
          """viewing an item again makes it the most recent"""
          r = Recent(5)
          for x in 'abca':
              r.view(x)
          assert r.items() == ['a', 'c', 'b'], f"got {r.items()}"
          assert len(r) == 3

      def test_capacity():
          """the least recently viewed item is dropped"""
          r = Recent(2)
          for x in 'abac':
              r.view(x)
          assert r.items() == ['c', 'a'], f"got {r.items()}"
          assert len(r) == 2
    solution: |
      from collections import OrderedDict

      class Recent:
          def __init__(self, capacity):
              self.capacity = capacity
              self._data = OrderedDict()

          def view(self, item):
              self._data[item] = None
              self._data.move_to_end(item)
              if len(self._data) > self.capacity:
                  self._data.popitem(last=False)

          def items(self):
              return list(reversed(self._data))

          def __len__(self):
              return len(self._data)
    hints:
      - "Assigning to an existing key doesn't move it. Call `move_to_end(item)` after storing it."
      - "The oldest item is at the front: remove it with `popitem(last=False)`. For the result, `reversed(self._data)` walks from newest to oldest."

  - id: case-insensitive-dict
    title: A case-insensitive dictionary
    prompt: |
      Write `CaseInsensitiveDict`, a dictionary whose string keys are case-insensitive: `d['Content-Type']`, `d['content-type']` and `d.get('CONTENT-TYPE')` all refer to the same entry, and `'CONTENT-TYPE' in d` is `True`.

      Store keys **lowercased**. The behavior must also hold for the constructor, `update`, `get` and `del`. Non-string keys are stored unchanged.

      The starter subclasses `dict`. Switch to `UserDict` and make it work everywhere.
    starter: |
      class CaseInsensitiveDict(dict):
          @staticmethod
          def _norm(key):
              return key.lower() if isinstance(key, str) else key

          def __setitem__(self, key, value):
              super().__setitem__(self._norm(key), value)

          def __getitem__(self, key):
              return super().__getitem__(self._norm(key))
    tests: |
      def test_get_and_set():
          """[] ignores case"""
          d = CaseInsensitiveDict()
          d['Content-Type'] = 'text/html'
          assert d['content-type'] == 'text/html'
          assert d['CONTENT-TYPE'] == 'text/html'

      def test_constructor_and_update():
          """keys passed to the constructor or update are lowercased"""
          d = CaseInsensitiveDict({'Accept': '*/*'})
          d.update({'Host': 'example.com'})
          assert sorted(d.keys()) == ['accept', 'host'], f"keys: {list(d.keys())}"

      def test_get_and_contains():
          """get() and `in` ignore case"""
          d = CaseInsensitiveDict(Accept='*/*')
          assert d.get('ACCEPT') == '*/*', f"get returned {d.get('ACCEPT')!r}"
          assert 'aCcEpT' in d, "`in` is case-sensitive"
          assert d.get('missing', 'n/a') == 'n/a'

      def test_delete():
          """del ignores case"""
          d = CaseInsensitiveDict(Accept='*/*')
          del d['ACCEPT']
          assert len(d) == 0

      def test_non_string_keys():
          """non-string keys are stored as they are"""
          d = CaseInsensitiveDict()
          d[1] = 'one'
          assert d[1] == 'one' and 1 in d
    solution: |
      from collections import UserDict

      class CaseInsensitiveDict(UserDict):
          @staticmethod
          def _norm(key):
              return key.lower() if isinstance(key, str) else key

          def __setitem__(self, key, value):
              super().__setitem__(self._norm(key), value)

          def __getitem__(self, key):
              return super().__getitem__(self._norm(key))

          def __delitem__(self, key):
              super().__delitem__(self._norm(key))

          def __contains__(self, key):
              return super().__contains__(self._norm(key))
    hints:
      - "With a `dict` subclass, the constructor, `update` and `get` skip your overrides. Inherit from `collections.UserDict` instead."
      - "`UserDict` implements `in` with its own `__contains__` (it checks `self.data` directly), and `get` relies on `in`. Override `__contains__` and `__delitem__` too."
