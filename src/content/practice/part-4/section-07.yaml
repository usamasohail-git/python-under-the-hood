    tests: |
      STORAGE = {'name': 'Thumbdrive', 'manufacturer': 'Sandisk', 'total': 10,
                 'allocated': 3, 'capacity_gb': 512}
      HDD_VALUES = {'name': '1TB SATA HDD', 'manufacturer': 'Seagate', 'total': 10,
                    'allocated': 3, 'capacity_gb': 1_000, 'size': '3.5"', 'rpm': 10_000}
      SSD_VALUES = {'name': 'Samsung 860 EVO', 'manufacturer': 'Samsung', 'total': 10,
                    'allocated': 3, 'capacity_gb': 1_000, 'interface': 'SATA III'}

      def expect(exc_type, fn):
          try:
              fn()
          except exc_type:
              return
          except Exception as ex:
              assert False, f"expected {exc_type.__name__}, got {type(ex).__name__}: {ex}"
          assert False, f"expected {exc_type.__name__}"

      def test_hierarchy():
          """HDD and SSD are Storage, which is a Resource"""
          assert [c.__name__ for c in HDD.__mro__] == ['HDD', 'Storage', 'Resource', 'object']
          assert [c.__name__ for c in SSD.__mro__] == ['SSD', 'Storage', 'Resource', 'object']

      def test_create_all():
          """every value is stored for all three classes"""
          for cls, values in ((Storage, STORAGE), (HDD, HDD_VALUES), (SSD, SSD_VALUES)):
              obj = cls(**values)
              for attr, value in values.items():
                  assert getattr(obj, attr) == value, f"{cls.__name__}.{attr}: got {getattr(obj, attr)!r}"

      def test_inherited_behavior():
          """categories and inventory methods come from Resource"""
          hdd, ssd = HDD(**HDD_VALUES), SSD(**SSD_VALUES)
          assert (Storage(**STORAGE).category, hdd.category, ssd.category) == ('storage', 'hdd', 'ssd')
          hdd.claim(7)
          assert hdd.available == 0
          for cls in (Storage, HDD, SSD):
              assert 'claim' not in cls.__dict__ and 'category' not in cls.__dict__

      def test_capacity_validation():
          """capacity_gb must be an integer >= 1, for every storage class"""
          for cls, values in ((Storage, STORAGE), (HDD, HDD_VALUES), (SSD, SSD_VALUES)):
              expect(TypeError, lambda: cls(**dict(values, capacity_gb=10.5)))
              expect(ValueError, lambda: cls(**dict(values, capacity_gb=0)))
              expect(ValueError, lambda: cls(**dict(values, capacity_gb=-1)))

      def test_resource_validation_applies():
          """the Resource validation still runs"""
          expect(ValueError, lambda: SSD(**dict(SSD_VALUES, allocated=20)))
          expect(ValueError, lambda: HDD(**dict(HDD_VALUES, total=-1)))

      def test_hdd_size():
          """HDD size must be one of the two allowed sizes"""
          expect(ValueError, lambda: HDD(**dict(HDD_VALUES, size='2.5')))
          expect(ValueError, lambda: HDD(**dict(HDD_VALUES, size='5.25"')))
          assert HDD(**dict(HDD_VALUES, size='2.5"')).size == '2.5"'

      def test_hdd_rpm():
          """HDD rpm must be an integer between 1,000 and 50,000"""
          expect(TypeError, lambda: HDD(**dict(HDD_VALUES, rpm='100')))
          expect(ValueError, lambda: HDD(**dict(HDD_VALUES, rpm=100)))
          expect(ValueError, lambda: HDD(**dict(HDD_VALUES, rpm=100_000)))
          HDD(**dict(HDD_VALUES, rpm=1_000))
          HDD(**dict(HDD_VALUES, rpm=50_000))

      def test_read_only():
          """new attributes are read-only properties"""
          for cls, values, attrs in ((Storage, STORAGE, ['capacity_gb']),
                                     (HDD, HDD_VALUES, ['size', 'rpm']),
                                     (SSD, SSD_VALUES, ['interface'])):
              obj = cls(**values)
              for attr in attrs:
                  expect(AttributeError, lambda: setattr(obj, attr, 1))

      def test_reprs():
          """reprs show the category and specific attributes"""
          assert repr(Storage(**STORAGE)) == 'storage: 512 GB', repr(Storage(**STORAGE))
          assert repr(HDD(**HDD_VALUES)) == 'hdd: 1000 GB (3.5", 10000 rpm)', repr(HDD(**HDD_VALUES))
          assert repr(SSD(**SSD_VALUES)) == 'ssd: 1000 GB (SATA III)', repr(SSD(**SSD_VALUES))

      def test_repr_extends_parent():
          """HDD and SSD build on Storage.__repr__ via super()"""
          original = Storage.__repr__
          Storage.__repr__ = lambda self: 'STORAGE-REPR'
          try:
              hdd_text, ssd_text = repr(HDD(**HDD_VALUES)), repr(SSD(**SSD_VALUES))
          finally:
              Storage.__repr__ = original
          assert hdd_text.startswith('STORAGE-REPR'), f"HDD repr doesn't use super().__repr__(): {hdd_text!r}"
          assert ssd_text.startswith('STORAGE-REPR'), f"SSD repr doesn't use super().__repr__(): {ssd_text!r}"
