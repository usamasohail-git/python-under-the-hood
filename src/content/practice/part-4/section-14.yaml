quiz:
  - q: What does this print?
    code: |
      class A:
          def __new__(cls):
              return 42

          def __init__(self):
              print('init')

      x = A()
      print(x)
    options:
      - "`init` and then `42`"
      - "`42`"
      - "`init` and then `<__main__.A object ...>`"
      - "A `TypeError`, because `__new__` must return an instance of `A`"
    answer: 1
    explain: |
      Whatever `__new__` returns is the result of the call. `__init__` runs only if that object is an instance of `A`, and `42` isn't, so `__init__` is silently skipped.

  - q: "What does `type('Point', (), {'x': 0, 'y': 0})` return?"
    options:
      - "A new class named `Point` that inherits from `object` and has class attributes `x` and `y`"
      - The type of the string `'Point'`, which is `str`
      - "An instance of an existing class `Point`"
      - "A `TypeError`: `type` takes exactly one argument"
    answer: 0
    explain: |
      With three arguments, `type(name, bases, namespace)` creates a new class. That is exactly what a `class` statement does after running its body into the namespace dictionary.

  - q: What does this print?
    code: |
      class Meta(type):
          def __new__(mcls, name, bases, ns):
              print('creating', name)
              return super().__new__(mcls, name, bases, ns)

      class A(metaclass=Meta):
          pass

      class B(A):
          pass

      print(type(B).__name__)
    options:
      - "`creating A` and then `type`"
      - "`creating A`, `creating B` and then `type`"
      - "`creating A`, `creating B` and then `Meta`"
      - "`creating A` and then `Meta`"
    answer: 2
    explain: |
      Metaclasses are inherited: Python picks the most derived metaclass among the bases' metaclasses, so `B` is also built by `Meta`, and its `__new__` runs again for `B`.

  - q: "`Meta1` and `Meta2` are two unrelated subclasses of `type`, `A` uses `metaclass=Meta1` and `B` uses `metaclass=Meta2`. What happens with `class C(A, B): pass`?"
    options:
      - "`C` gets `Meta1`, the metaclass of the first base"
      - "`C` gets plain `type`"
      - "`TypeError: metaclass conflict`"
      - "`C` is created twice, once by each metaclass"
    answer: 2
    explain: |
      The metaclass of a class must be a subclass of the metaclasses of all its bases. Neither `Meta1` nor `Meta2` is a subclass of the other, so Python can't choose one and raises a metaclass conflict. A combined `class Meta12(Meta1, Meta2)` would resolve it.

  - q: In what order are the messages printed?
    code: |
      class D:
          def __set_name__(self, owner, name):
              print('set_name')

      class Base:
          def __init_subclass__(cls):
              print('init_subclass')

      def deco(cls):
          print('decorator')
          return cls

      @deco
      class C(Base):
          d = D()
    options:
      - "`decorator`, `set_name`, `init_subclass`"
      - "`init_subclass`, `set_name`, `decorator`"
      - "`set_name`, `decorator`, `init_subclass`"
      - "`set_name`, `init_subclass`, `decorator`"
    answer: 3
    explain: |
      Both `__set_name__` and `__init_subclass__` are called by `type.__new__` while the class is being created, with `__set_name__` first. The decorator only gets the class after creation is complete.

  - q: What is the job of a metaclass's `__prepare__` method?
    options:
      - It creates the mapping that the class body is executed in, before the body runs
      - It runs after the class is created, to validate it
      - It is called every time an instance of the class is created
      - It prepares the bases tuple by computing the MRO
    answer: 0
    explain: |
      `__prepare__(name, bases, **kwargs)` returns the namespace for the body. Pre-filled entries are visible inside the body, and a custom `dict` subclass can intercept every assignment the body makes.

  - q: What does this print?
    code: |
      class A:
          x = 1

          def __getattr__(self, name):
              return name.upper()

      a = A()
      print(a.x, a.y)
    options:
      - "`X Y`"
      - "`1 Y`"
      - "`1` and then an `AttributeError`"
      - "`X` and then an `AttributeError`"
    answer: 1
    explain: |
      `__getattr__` is only a fallback. `a.x` is found normally as a class attribute, so `__getattr__` is called only for the missing `y`.

  - q: What happens here?
    code: |
      class Proxy:
          def __getattr__(self, name):
              return lambda: 3

      p = Proxy()
      print(p.__len__())
      print(len(p))
    options:
      - "It prints `3`, then `len(p)` raises a `TypeError`"
      - "It prints `3` twice"
      - "Both lines raise `AttributeError`"
      - "It prints `3`, then `0`"
    answer: 0
    explain: |
      `p.__len__` is an explicit attribute access, so it reaches `__getattr__`. But `len(p)` looks `__len__` up directly on the type, bypassing `__getattribute__` and `__getattr__`, and `Proxy` doesn't define it.

  - q: What does this print?
    code: |
      def add_tag(cls):
          cls.tagged_by = cls.__name__
          return cls

      @add_tag
      class A:
          pass

      class B(A):
          pass

      print(B.tagged_by)
    options:
      - "`B`"
      - "An `AttributeError`, because `B` wasn't decorated"
      - "`A`"
      - "`None`"
    answer: 2
    explain: |
      The decorator ran only once, on `A`. `B` isn't decorated, but it inherits the class attribute `tagged_by`, whose value is `'A'`. Class decorators don't re-run for subclasses; a metaclass or `__init_subclass__` would.

  - q: "On Python 3.13, what does `print(callable(staticmethod(f)), callable(classmethod(f)))` print for an ordinary function `f`?"
    options:
      - "`False False`"
      - "`True True`"
      - "`False True`"
      - "`True False`"
    answer: 3
    explain: |
      Since Python 3.10, `staticmethod` objects are callable; `classmethod` objects still aren't. That's why a class decorator should test for `staticmethod`/`classmethod` before testing `callable`.

  - q: Which lines does this code print?
    code: |
      class P:
          def __init__(self):
              self.a = 1

          def __setattr__(self, name, value):
              print('set', name)
              super().__setattr__(name, value)

      p = P()
      p.b = 2
      P.c = 3
    options:
      - "`set b` only"
      - "`set a` and `set b`"
      - "`set a`, `set b` and `set c`"
      - "`set b` and `set c`"
    answer: 1
    explain: |
      `__setattr__` intercepts every write to an instance, including the one in `__init__`. `P.c = 3` writes to the class object, which is handled by the metaclass's `__setattr__` (here `type`'s), not `P.__setattr__`.

  - q: What does this print?
    code: |
      class Meta(type):
          def __call__(cls, *args):
              if getattr(cls, '_inst', None) is None:
                  cls._inst = super().__call__(*args)
              return cls._inst

      class A(metaclass=Meta):
          pass

      class B(A):
          pass

      a = A()
      b = B()
      print(type(b).__name__)
    options:
      - "`A`"
      - "`B`"
      - "`Meta`"
      - "`NoneType`"
    answer: 0
    explain: |
      `getattr(B, '_inst', None)` finds `A._inst` through inheritance, so `B()` returns the existing `A` instance. Storing the cache in a dictionary keyed by class avoids this bug.

exercises:
  - id: singleton-metaclass
    title: A singleton metaclass
    prompt: |
      Write a metaclass `Singleton` so that every class using it (directly or through inheritance) has **at most one instance**:

      - calling the class a second time returns the same object;
      - each class gets its **own** instance, subclasses included;
      - `__init__` runs only the first time the class is called.

      Override `__call__` in the metaclass.
    starter: |
      class Singleton(type):
          pass
    tests: |
      def test_same_instance():
          """calling the class twice returns the same object"""
          class Config(metaclass=Singleton):
              pass
          assert Config() is Config(), "two calls returned different objects"

      def test_separate_classes():
          """two singleton classes have different instances"""
          class A(metaclass=Singleton):
              pass
          class B(metaclass=Singleton):
              pass
          assert A() is not B()
          assert type(A()) is A and type(B()) is B

      def test_subclass_gets_own_instance():
          """a subclass has its own single instance"""
          class Parent(metaclass=Singleton):
              pass
          class Child(Parent):
              pass
          p = Parent()
          c = Child()
          assert type(c) is Child, f"Child() returned a {type(c).__name__}"
          assert c is Child() and p is Parent()

      def test_init_runs_once():
          """__init__ runs only on the first call"""
          calls = []
          class Counter(metaclass=Singleton):
              def __init__(self, value):
                  calls.append(value)
                  self.value = value
          first = Counter(1)
          second = Counter(2)
          assert calls == [1], f"__init__ ran for {calls}"
          assert second.value == 1
    solution: |
      class Singleton(type):
          _instances = {}

          def __call__(cls, *args, **kwargs):
              if cls not in Singleton._instances:
                  Singleton._instances[cls] = super().__call__(*args, **kwargs)
              return Singleton._instances[cls]
    hints:
      - "`Cls()` runs `type(Cls).__call__(Cls)`. In your metaclass, `super().__call__(*args, **kwargs)` performs the normal `__new__` + `__init__`."
      - "Don't store the instance as a class attribute: a subclass would find its parent's instance through inheritance. Use a dictionary keyed by the class."

  - id: plugin-registry
    title: A plugin registry with __init_subclass__
    prompt: |
      Complete the `Plugin` base class so that every subclass registers itself in `Plugin.registry`, a dictionary mapping a name to the class:

      - the name comes from a class keyword, `class CsvExporter(Plugin, name='csv')`;
      - without the keyword, use the class name in lower case;
      - registering a name that's already taken raises `ValueError`;
      - `Plugin` itself is not registered.

      Use `__init_subclass__`, not a metaclass.
    starter: |
      class Plugin:
          registry = {}

          def __init_subclass__(cls, **kwargs):
              super().__init_subclass__(**kwargs)
    tests: |
      def test_explicit_name():
          """the name keyword is used as the key"""
          class CsvExporter(Plugin, name='csv'):
              pass
          assert Plugin.registry.get('csv') is CsvExporter, f"registry: {Plugin.registry}"

      def test_default_name():
          """without a keyword, the lowercased class name is used"""
          class JsonExporter(Plugin):
              pass
          assert Plugin.registry.get('jsonexporter') is JsonExporter, f"registry: {Plugin.registry}"

      def test_grandchildren():
          """subclasses of subclasses register too"""
          class Base1(Plugin, name='base1'):
              pass
          class Derived1(Base1, name='derived1'):
              pass
          assert Plugin.registry.get('derived1') is Derived1

      def test_duplicate():
          """a duplicate name raises ValueError"""
          class First(Plugin, name='dup'):
              pass
          try:
              class Second(Plugin, name='dup'):
                  pass
          except ValueError:
              pass
          else:
              raise AssertionError('expected ValueError for a duplicate name')
          assert Plugin.registry['dup'] is First

      def test_base_not_registered():
          """Plugin itself is not in the registry"""
          assert Plugin not in Plugin.registry.values()
    solution: |
      class Plugin:
          registry = {}

          def __init_subclass__(cls, name=None, **kwargs):
              super().__init_subclass__(**kwargs)
              key = name or cls.__name__.lower()
              if key in Plugin.registry:
                  raise ValueError(f'plugin name {key!r} is already registered')
              Plugin.registry[key] = cls
    hints:
      - "`__init_subclass__` is implicitly a class method. Class keywords such as `name='csv'` arrive as its keyword arguments, so add a `name=None` parameter."
      - "It runs for every subclass at any depth, but never for the class that defines it."
      - "Write to `Plugin.registry` explicitly so all subclasses share one dictionary."

  - id: no-duplicates
    title: Catch duplicate definitions with __prepare__
    prompt: |
      Write a metaclass `NoDuplicates` that raises `TypeError` if a class body defines the same non-dunder name twice, for example two methods called `area`. The error message must contain the duplicated name.

      Names that start with `__` may be set more than once. Classes without duplicates must work normally, and the final class must have an ordinary class namespace.

      Use `__prepare__` to return a custom `dict` subclass.
    starter: |
      class NoDuplicates(type):
          pass
    tests: |
      def test_normal_class():
          """a class without duplicates works normally"""
          class Shape(metaclass=NoDuplicates):
              sides = 4
              def area(self):
                  return 1
              def perimeter(self):
                  return 4
          assert Shape().area() == 1 and Shape.sides == 4
          assert type(Shape) is NoDuplicates

      def test_duplicate_method():
          """two methods with the same name raise TypeError"""
          try:
              class Bad(metaclass=NoDuplicates):
                  def area(self):
                      return 1
                  def area(self):
                      return 2
          except TypeError as ex:
              assert 'area' in str(ex), f"message should mention 'area': {ex}"
          else:
              raise AssertionError('expected a TypeError')

      def test_duplicate_attribute():
          """re-assigning a class attribute raises TypeError"""
          try:
              class Bad(metaclass=NoDuplicates):
                  color = 'red'
                  color = 'blue'
          except TypeError:
              pass
          else:
              raise AssertionError('expected a TypeError')

      def test_dunder_allowed():
          """dunder names may be set more than once"""
          class Ok(metaclass=NoDuplicates):
              __doc__ = 'first'
              __doc__ = 'second'
          assert Ok.__doc__ == 'second'

      def test_subclass():
          """subclasses use the same rule"""
          class Base(metaclass=NoDuplicates):
              pass
          try:
              class Child(Base):
                  x = 1
                  x = 2
          except TypeError:
              pass
          else:
              raise AssertionError('expected a TypeError in the subclass')
    solution: |
      class NoDuplicatesDict(dict):
          def __setitem__(self, key, value):
              if key in self and not key.startswith('__'):
                  raise TypeError(f'{key!r} is defined more than once')
              super().__setitem__(key, value)

      class NoDuplicates(type):
          @classmethod
          def __prepare__(mcls, name, bases, **kwargs):
              return NoDuplicatesDict()

          def __new__(mcls, name, bases, ns, **kwargs):
              return super().__new__(mcls, name, bases, dict(ns), **kwargs)
    hints:
      - "Every assignment and `def` in the class body calls `__setitem__` on the namespace mapping. Override it in a `dict` subclass."
      - "Return an instance of your mapping from `__prepare__` (a `@classmethod` taking `mcls, name, bases, **kwargs`)."
      - "In `__new__`, pass a plain `dict(ns)` to `super().__new__`."

  - id: dynamic-record
    title: A record with attribute access
    prompt: |
      Write a class `Record` that wraps a dictionary of fields given as keyword arguments, `Record(name='Alex', age=19)`, and exposes them as attributes:

      - reading `r.name` returns the field; reading an unknown field raises `AttributeError`;
      - assigning `r.age = 20` updates an existing field; assigning an unknown field raises `AttributeError`;
      - `r.as_dict()` returns a **copy** of the fields;
      - the fields live in a single instance attribute `_data` (so `vars(r)` is `{'_data': {...}}`).

      Use `__getattr__` and `__setattr__`, and avoid infinite recursion by going through `super()` (or `object`) whenever you need the default behavior.
    starter: |
      class Record:
          def __init__(self, **fields):
              # store the fields without triggering your own __setattr__
              pass

          def __getattr__(self, name):
              pass

          def __setattr__(self, name, value):
              pass

          def as_dict(self):
              pass
    tests: |
      def test_read():
          """fields can be read as attributes"""
          r = Record(name='Alex', age=19)
          assert (r.name, r.age) == ('Alex', 19), f"got {(r.name, r.age)}"

      def test_unknown_read():
          """reading an unknown field raises AttributeError"""
          r = Record(name='Alex')
          try:
              r.salary
          except AttributeError:
              pass
          else:
              raise AssertionError('expected AttributeError for r.salary')
          assert not hasattr(r, 'salary')

      def test_write():
          """assigning an existing field updates it"""
          r = Record(name='Alex', age=19)
          r.age = 20
          assert r.age == 20 and r.as_dict() == {'name': 'Alex', 'age': 20}

      def test_unknown_write():
          """assigning an unknown field raises AttributeError"""
          r = Record(name='Alex')
          try:
              r.nickname = 'Al'
          except AttributeError:
              pass
          else:
              raise AssertionError('expected AttributeError for r.nickname = ...')
          assert r.as_dict() == {'name': 'Alex'}

      def test_storage():
          """fields are stored in a single _data attribute"""
          r = Record(x=1, y=2)
          assert vars(r) == {'_data': {'x': 1, 'y': 2}}, f"vars(r) is {vars(r)}"

      def test_as_dict_is_copy():
          """as_dict returns a copy"""
          r = Record(x=1)
          d = r.as_dict()
          d['x'] = 99
          assert r.x == 1, "changing the returned dict changed the record"
    solution: |
      class Record:
          def __init__(self, **fields):
              super().__setattr__('_data', dict(fields))

          def __getattr__(self, name):
              data = super().__getattribute__('_data')
              if name in data:
                  return data[name]
              raise AttributeError(f'no field {name!r}')

          def __setattr__(self, name, value):
              data = super().__getattribute__('_data')
              if name not in data:
                  raise AttributeError(f'no field {name!r}')
              data[name] = value

          def as_dict(self):
              return dict(self._data)
    hints:
      - "In `__init__`, `self._data = ...` would call your own `__setattr__`. Use `super().__setattr__('_data', dict(fields))` instead."
      - "`__getattr__` is only called for names the normal lookup can't find, so `_data` and `as_dict` never reach it."
      - "Inside the hooks, read the dictionary with `super().__getattribute__('_data')`."
