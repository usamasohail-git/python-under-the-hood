      from datetime import datetime, timezone

      def _parts(code):
          assert isinstance(code, str), f"expected a confirmation code string, got {code!r}"
          parts = code.split('-')
          assert len(parts) == 4, f"{code!r} doesn't have 4 dash-separated parts"
          return parts

      def test_code_format():
          """the confirmation code has the right parts"""
          a = Account('A100', 100)
          tc, acct, ts, tid = _parts(a.generate_confirmation_code('D'))
          assert tc == 'D', f"transaction code is {tc!r}"
          assert acct == 'A100', f"account number is {acct!r}"
          assert len(ts) == 14 and ts.isdigit(), f"timestamp {ts!r} is not YYYYMMDDHHMMSS"
          assert tid.isdigit(), f"transaction id {tid!r} is not a number"

      def test_code_time_is_utc_now():
          """the timestamp is the current UTC time"""
          a = Account('A100')
          ts = _parts(a.generate_confirmation_code('D'))[2]
          dt = datetime.strptime(ts, '%Y%m%d%H%M%S').replace(tzinfo=timezone.utc)
          diff = abs((datetime.now(timezone.utc) - dt).total_seconds())
          assert diff < 5, f"timestamp {ts} is {diff:.0f}s away from the current UTC time"

      def test_ids_shared():
          """transaction ids increase by 1 across all accounts"""
          a, b = Account('A1', 100), Account('B2', 100)
          ids = [int(_parts(code)[3]) for code in
                 (a.generate_confirmation_code('D'), b.deposit(1), a.withdraw(1), b.withdraw(1000))]
          assert ids == list(range(ids[0], ids[0] + 4)), f"ids were {ids}"

      def test_deposit():
          """deposit adds to the balance and returns a D code"""
          a = Account('A100', 100)
          code = a.deposit(50.5)
          assert _parts(code)[0] == 'D', f"got {code!r}"
          assert a.balance == 150.5, f"balance is {a.balance}"

      def test_bad_amounts():
          """invalid amounts raise ValueError and leave the balance alone"""
          a = Account('A100', 100)
          for method in (a.deposit, a.withdraw):
              for bad in (0, -10, '10', None):
                  try:
                      method(bad)
                  except ValueError:
                      continue
                  assert False, f"{method.__name__}({bad!r}) did not raise ValueError"
          assert a.balance == 100, f"balance changed to {a.balance}"

      def test_withdraw():
          """withdraw subtracts and returns a W code"""
          a = Account('A100', 100)
          code = a.withdraw(30)
          assert _parts(code)[0] == 'W', f"got {code!r}"
          assert a.balance == 70, f"balance is {a.balance}"
          a.withdraw(70)
          assert a.balance == 0, "withdrawing the whole balance should be allowed"

      def test_withdraw_declined():
          """an overdraft is declined with an X code"""
          a = Account('A100', 100)
          code = a.withdraw(100.01)
          assert _parts(code)[0] == 'X', f"got {code!r}"
          assert a.balance == 100, f"balance changed to {a.balance}"

      def test_pay_interest():
          """pay_interest adds balance * rate / 100 and returns an I code"""
          Account._interest_rate = 0.5
          a = Account('A100', 1000)
          code = a.pay_interest()
          assert _parts(code)[0] == 'I', f"got {code!r}"
          assert abs(a.balance - 1005) < 1e-9, f"balance is {a.balance}"
          Account._interest_rate = 2
          a.pay_interest()
          assert abs(a.balance - 1025.1) < 1e-9, f"with a 2% rate, balance is {a.balance}"
          Account._interest_rate = 0.5
    solution: |
      import itertools
      import numbers
      from datetime import datetime, timezone

      class Account:
          transaction_counter = itertools.count(100)
          _interest_rate = 0.5  # percent
          _transaction_codes = {'deposit': 'D', 'withdraw': 'W',
                                'interest': 'I', 'rejected': 'X'}

          def __init__(self, account_number, initial_balance=0):
              self._account_number = account_number
              self._balance = float(Account.validate_real_number(initial_balance, min_value=0))

          @property
          def account_number(self):
              return self._account_number

          @property
          def balance(self):
              return self._balance

          @staticmethod
          def validate_real_number(value, min_value=None):
              if not isinstance(value, numbers.Real):
                  raise ValueError('Value must be a real number.')
              if min_value is not None and value < min_value:
                  raise ValueError(f'Value must be at least {min_value}.')
              return value

          def generate_confirmation_code(self, transaction_code):
              dt_str = datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S')
              transaction_id = next(Account.transaction_counter)
              return f'{transaction_code}-{self.account_number}-{dt_str}-{transaction_id}'

          def deposit(self, value):
              value = Account.validate_real_number(value, min_value=0.01)
              conf_code = self.generate_confirmation_code(Account._transaction_codes['deposit'])
              self._balance += value
              return conf_code

          def withdraw(self, value):
              value = Account.validate_real_number(value, min_value=0.01)
              if self.balance - value < 0:
                  return self.generate_confirmation_code(Account._transaction_codes['rejected'])
              conf_code = self.generate_confirmation_code(Account._transaction_codes['withdraw'])
              self._balance -= value
              return conf_code

          def pay_interest(self):
              interest = self.balance * Account._interest_rate / 100
              conf_code = self.generate_confirmation_code(Account._transaction_codes['interest'])
              self._balance += interest
              return conf_code
    hints:
      - "`datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S')` gives the timestamp, and `next(Account.transaction_counter)` the next id."
      - Every transaction method validates first, then generates the code, then updates the balance, then returns the code.
      - A declined withdrawal still generates (and returns) a confirmation code, with the `'rejected'` transaction code.

  - id: parse-confirmation-code
    title: Parsing a confirmation code
    prompt: |
      `TimeZone` and the `Confirmation` namedtuple are provided. Add a **static method** `Account.parse_confirmation_code(confirmation_code, preferred_time_zone=None)` that returns a `Confirmation` with:

      - `account_number`, `transaction_code`, `transaction_id`: strings taken from the code
      - `time_utc`: the UTC time in ISO format, e.g. `'2019-03-15T14:59:00'`
      - `time`: the time shifted by the time zone's offset, as `'2019-03-15 07:59:00 (MST)'`

      The time zone defaults to `TimeZone('UTC', 0, 0)`. Raise `ValueError` if the code doesn't have exactly four dash-separated parts, if the timestamp isn't a valid `YYYYMMDDHHMMSS` date and time, or if the time zone isn't a `TimeZone`.
    starter: |
      import numbers
      from collections import namedtuple
      from datetime import datetime, timedelta

      class TimeZone:
          def __init__(self, name, offset_hours, offset_minutes):
              if name is None or len(str(name).strip()) == 0:
                  raise ValueError('Timezone name cannot be empty.')
              self._name = str(name).strip()

              if not isinstance(offset_hours, numbers.Integral):
                  raise ValueError('Hour offset must be an integer.')
              if not isinstance(offset_minutes, numbers.Integral):
                  raise ValueError('Minutes offset must be an integer.')
              if offset_minutes < -59 or offset_minutes > 59:
                  raise ValueError('Minutes offset must be between -59 and 59 (inclusive).')

              offset = timedelta(hours=offset_hours, minutes=offset_minutes)
              # real-world UTC offsets range from -12:00 to +14:00
              if offset < timedelta(hours=-12) or offset > timedelta(hours=14):
                  raise ValueError('Offset must be between -12:00 and +14:00.')

              self._offset_hours = offset_hours
              self._offset_minutes = offset_minutes
              self._offset = offset

          @property
          def offset(self):
              return self._offset

          @property
          def name(self):
              return self._name

          def __eq__(self, other):
              return (isinstance(other, TimeZone) and
                      self.name == other.name and
                      self._offset_hours == other._offset_hours and
                      self._offset_minutes == other._offset_minutes)

          def __repr__(self):
              return (f"TimeZone(name='{self.name}', "
                      f"offset_hours={self._offset_hours}, "
                      f"offset_minutes={self._offset_minutes})")


      Confirmation = namedtuple(
          'Confirmation',
          'account_number transaction_code transaction_id time_utc time'
      )


      class Account:
          def parse_confirmation_code(confirmation_code, preferred_time_zone=None):
              pass
    tests: |
      CODE = 'D-140568-20190315145900-124'

      def test_returns_confirmation():
          """returns a Confirmation with the code's parts"""
          r = Account.parse_confirmation_code(CODE)
          assert isinstance(r, Confirmation), f"got {r!r}"
          assert (r.account_number, r.transaction_code, r.transaction_id) == ('140568', 'D', '124'), f"got {r!r}"

      def test_default_utc():
          """the default time zone is UTC"""
          r = Account.parse_confirmation_code(CODE)
          assert r.time_utc == '2019-03-15T14:59:00', f"time_utc is {r.time_utc!r}"
          assert r.time == '2019-03-15 14:59:00 (UTC)', f"time is {r.time!r}"

      def test_mst():
          """times are converted to the given time zone"""
          r = Account.parse_confirmation_code(CODE, TimeZone('MST', -7, 0))
          assert r.time_utc == '2019-03-15T14:59:00', f"time_utc is {r.time_utc!r}"
          assert r.time == '2019-03-15 07:59:00 (MST)', f"time is {r.time!r}"

      def test_crosses_midnight():
          """a half-hour offset can move the date forward"""
          r = Account.parse_confirmation_code('W-A1-20191231220000-7', TimeZone('IST', 5, 30))
          assert r.time == '2020-01-01 03:30:00 (IST)', f"time is {r.time!r}"

      def test_is_static():
          """parse_confirmation_code is a static method"""
          assert isinstance(Account.__dict__.get('parse_confirmation_code'), staticmethod)
          r = Account().parse_confirmation_code(CODE)
          assert r.transaction_id == '124', "calling it through an instance should work too"

      def test_invalid_codes():
          """malformed codes raise ValueError"""
          for bad in ('D-140568-124', 'D-140568-20190315145900-124-9', 'D-1-asdasd-1', 'D-1-20191345000000-1'):
              try:
                  Account.parse_confirmation_code(bad)
              except ValueError:
                  continue
              assert False, f"{bad!r} did not raise ValueError"

      def test_invalid_timezone():
          """a time zone that isn't a TimeZone raises ValueError"""
          try:
              Account.parse_confirmation_code(CODE, -7)
          except ValueError:
              return
          assert False, "preferred_time_zone=-7 did not raise ValueError"
