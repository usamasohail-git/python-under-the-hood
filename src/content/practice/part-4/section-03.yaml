      import numbers
      from collections import namedtuple
      from datetime import datetime, timedelta

      class TimeZone:
          def __init__(self, name, offset_hours, offset_minutes):
              if name is None or len(str(name).strip()) == 0:
                  raise ValueError('Timezone name cannot be empty.')
              self._name = str(name).strip()

              if not isinstance(offset_hours, numbers.Integral):
                  raise ValueError('Hour offset must be an integer.')
              if not isinstance(offset_minutes, numbers.Integral):
                  raise ValueError('Minutes offset must be an integer.')
              if offset_minutes < -59 or offset_minutes > 59:
                  raise ValueError('Minutes offset must be between -59 and 59 (inclusive).')

              offset = timedelta(hours=offset_hours, minutes=offset_minutes)
              # real-world UTC offsets range from -12:00 to +14:00
              if offset < timedelta(hours=-12) or offset > timedelta(hours=14):
                  raise ValueError('Offset must be between -12:00 and +14:00.')

              self._offset_hours = offset_hours
              self._offset_minutes = offset_minutes
              self._offset = offset

          @property
          def offset(self):
              return self._offset

          @property
          def name(self):
              return self._name

          def __eq__(self, other):
              return (isinstance(other, TimeZone) and
                      self.name == other.name and
                      self._offset_hours == other._offset_hours and
                      self._offset_minutes == other._offset_minutes)

          def __repr__(self):
              return (f"TimeZone(name='{self.name}', "
                      f"offset_hours={self._offset_hours}, "
                      f"offset_minutes={self._offset_minutes})")


      Confirmation = namedtuple(
          'Confirmation',
          'account_number transaction_code transaction_id time_utc time'
      )


      class Account:
          @staticmethod
          def parse_confirmation_code(confirmation_code, preferred_time_zone=None):
              parts = confirmation_code.split('-')
              if len(parts) != 4:
                  raise ValueError('Invalid confirmation code.')
              transaction_code, account_number, raw_dt_utc, transaction_id = parts

              try:
                  dt_utc = datetime.strptime(raw_dt_utc, '%Y%m%d%H%M%S')
              except ValueError as ex:
                  raise ValueError('Invalid transaction datetime.') from ex

              if preferred_time_zone is None:
                  preferred_time_zone = TimeZone('UTC', 0, 0)
              if not isinstance(preferred_time_zone, TimeZone):
                  raise ValueError('Invalid TimeZone specified.')

              dt_preferred = dt_utc + preferred_time_zone.offset
              dt_preferred_str = (f"{dt_preferred.strftime('%Y-%m-%d %H:%M:%S')} "
                                  f"({preferred_time_zone.name})")
              return Confirmation(account_number, transaction_code, transaction_id,
                                  dt_utc.isoformat(), dt_preferred_str)
    hints:
      - "Split on `'-'`, check the length, then unpack: `transaction_code, account_number, raw_dt_utc, transaction_id = parts`."
      - "`datetime.strptime(raw, '%Y%m%d%H%M%S')` parses the timestamp and raises `ValueError` if it's invalid. `.isoformat()` gives `time_utc`."
      - "The local time is `dt_utc + tz.offset`; format it with `strftime('%Y-%m-%d %H:%M:%S')` and append the zone name in parentheses."
