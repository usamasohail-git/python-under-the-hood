quiz:
  - q: What does this print?
    code: |
      import csv
      line = '"Kohler, Bradtke and Davis",Support,80-0975518'
      print(len(line.split(',')), len(next(csv.reader([line]))))
    options:
      - "`3 3`"
      - "`4 4`"
      - "`4 3`"
      - "`3 4`"
    answer: 2
    explain: |
      `split(',')` knows nothing about quoting and also splits inside the quoted employer name. `csv.reader` treats the quoted text as one field, giving the correct three fields.

  - q: What does this print?
    code: |
      from itertools import chain, compress
      masks = ([True, False], [False, True])
      mask = chain.from_iterable(masks)
      rows = [['a', 'b', 'c', 'd'], ['e', 'f', 'g', 'h']]
      for row in rows:
          print(list(compress(row, mask)))
    options:
      - "`['a', 'd']` then `['e', 'h']`"
      - "`['a', 'd']` then `[]`"
      - "`['a', 'b', 'c', 'd']` then `['e', 'f', 'g', 'h']`"
      - "`['a']` then `['h']`"
    answer: 1
    explain: |
      `chain.from_iterable` returns a one-shot **iterator**. The first `compress` uses up all four selectors, so for the second row there are no selectors left and `compress` stops immediately. Storing the flattened mask with `tuple(...)` fixes it.

  - q: Three aligned generators yield named tuples `A`, `B` and `C` records. What is each item of `zip(gen_a, gen_b, gen_c)`?
    options:
      - "One flat tuple containing all the fields of the three records"
      - "A tuple of three named tuples: one `A`, one `B` and one `C` record"
      - "A single named tuple with the fields of all three classes"
      - "A list of three field values"
    answer: 1
    explain: |
      `zip` simply bundles the next item of each input into a tuple. Flattening those three records into one sequence of values is a separate step, done with `chain.from_iterable`.

  - q: What does this print?
    code: |
      from itertools import groupby
      makes = ['Ford', 'GMC', 'Ford', 'Ford', 'GMC']
      print([(k, len(list(g))) for k, g in groupby(makes)])
    options:
      - "`[('Ford', 3), ('GMC', 2)]`"
      - "`[('Ford', 1), ('GMC', 1), ('Ford', 2), ('GMC', 1)]`"
      - "`[('GMC', 2), ('Ford', 3)]`"
      - "`[('Ford', 1), ('GMC', 1)]`"
    answer: 1
    explain: |
      `groupby` groups only **consecutive** equal items, so `'Ford'` and `'GMC'` each appear more than once. Sorting with the same key first (`groupby(sorted(makes))`) gives one group per make.

  - q: What does this print?
    code: |
      from functools import partial

      def filter_key(min_year, make, row):
          return row[0] == make and row[1] >= min_year

      is_new_ford = partial(filter_key, 2000, 'Ford')
      rows = [('Ford', 1997), ('Ford', 2005), ('GMC', 2010)]
      print(list(filter(is_new_ford, rows)))
    options:
      - "`[('Ford', 2005)]`"
      - "`[('Ford', 1997), ('Ford', 2005)]`"
      - "`[('Ford', 2005), ('GMC', 2010)]`"
      - "A `TypeError`: `filter_key` needs three arguments"
    answer: 0
    explain: |
      `partial` fixes `min_year=2000` and `make='Ford'`, producing a one-argument function, which is what `filter` needs. Only the 2005 Ford passes both tests.

  - q: |
      A generator function opens a file with `with open(...) as f:` and does `yield from csv.reader(f)`. When is the file closed?
    options:
      - "Immediately after the generator function is called"
      - "After the first row has been yielded"
      - "When the generator finishes, or is closed or garbage-collected if the caller stops early"
      - "Never: files opened inside generators must be closed manually"
    answer: 2
    explain: |
      Calling a generator function runs none of its body. The file opens on the first `next()`, and the `with` block exits when the generator runs to completion. If you stop early, the `with` block exits when the generator is closed (`gen.close()`) or garbage-collected.

  - q: |
      You parse `last_updated` with `datetime.fromisoformat('2017-10-07T00:14:42Z')` (Python 3.11+), then test `row.last_updated >= datetime(2017, 3, 1)`. What happens?
    options:
      - It works, because both are `datetime` objects
      - It compares the dates as strings
      - "A `TypeError`, because an aware datetime is compared with a naive one"
      - The `Z` is rejected with a `ValueError`
    answer: 2
    explain: |
      Since 3.11 `fromisoformat` accepts the `Z` suffix and returns a timezone-**aware** datetime (UTC), while `datetime(2017, 3, 1)` is **naive**. Python refuses to order them. Either make the cutoff aware too (`tzinfo=timezone.utc`), or parse naively with `strptime`.

