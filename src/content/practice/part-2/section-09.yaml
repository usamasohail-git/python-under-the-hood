      import csv
      import itertools
      from collections import namedtuple
      from datetime import datetime

      def parse_date(value, *, fmt='%Y-%m-%dT%H:%M:%SZ'):
          return datetime.strptime(value, fmt)

      def csv_parser(fname, *, include_header=False):
          with open(fname) as f:
              reader = csv.reader(f, delimiter=',', quotechar='"')
              if not include_header:
                  next(reader)
              yield from reader

      def extract_field_names(fname):
          return next(csv_parser(fname, include_header=True))

      def iter_file(fname, class_name, parser):
          nt_class = namedtuple(class_name, extract_field_names(fname))
          for row in csv_parser(fname):
              yield nt_class(*(parse_fn(value) for value, parse_fn in zip(row, parser)))

      FNAMES = ('data/personal_info.csv', 'data/employment.csv',
                'data/vehicles.csv', 'data/update_status.csv')
      CLASS_NAMES = ('Personal', 'Employment', 'Vehicle', 'UpdateStatus')
      PARSERS = ((str, str, str, str, str), (str, str, str, str),
                 (str, str, str, int), (str, parse_date, parse_date))

      def iter_combined():
          headers = [extract_field_names(fname) for fname in FNAMES]
          # keep every column of the first file, and every non-ssn column of the others
          mask = tuple(i == 0 or name != 'ssn'
                       for i, header in enumerate(headers) for name in header)
          all_fields = itertools.chain.from_iterable(headers)
          Data = namedtuple('Data', itertools.compress(all_fields, mask))

          file_iters = (iter_file(fname, class_name, parser)
                        for fname, class_name, parser in zip(FNAMES, CLASS_NAMES, PARSERS))
          for records in zip(*file_iters):
              values = itertools.chain.from_iterable(records)
              yield Data(*itertools.compress(values, mask))
    hints:
      - "`zip(*file_iters)` yields a tuple of four records (one per file) for each person."
      - "`itertools.chain.from_iterable(records)` flattens the four records into one stream of values."
      - "Build a Boolean mask (one entry per column across all four headers) that is `False` for the extra `ssn` columns, store it as a **tuple**, and use `itertools.compress` on both the header names and every row."

