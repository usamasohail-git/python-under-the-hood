  - id: goal-1-typed-iterators
    title: "Goal 1: typed iterators per file"
    prompt: |
      Write two functions:

      - `parse_date(value)` converts a string like `'2017-10-07T00:14:42Z'` into a **naive** `datetime` (no time zone).
      - `iter_file(fname, class_name, parser)` is a generator that lazily reads the CSV file `fname` and yields one named tuple per **data row**. The named tuple class is called `class_name` and its field names come from the file's header row. `parser` is a tuple of one-argument functions, one per column, used to convert each value.

      For example, `iter_file('data/vehicles.csv', 'Vehicle', (str, str, str, int))` should first yield `Vehicle(ssn='100-53-9824', vehicle_make='Oldsmobile', vehicle_model='Bravada', model_year=1993)`.

      Some employer names contain commas inside quotes, so use the `csv` module rather than `split(',')`.
    starter: |
