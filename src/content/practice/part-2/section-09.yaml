      from collections import namedtuple
      from datetime import datetime

      def parse_date(value):
          """'2017-10-07T00:14:42Z' -> datetime(2017, 10, 7, 0, 14, 42)"""
          pass

      def iter_file(fname, class_name, parser):
          """Lazily yield one named tuple per data row of the CSV file fname."""
          pass
    tests: |
      from datetime import datetime

      VEHICLE_PARSER = (str, str, str, int)

      def test_parse_date():
          """parse_date returns a naive datetime"""
          d = parse_date('2017-10-07T00:14:42Z')
          assert d == datetime(2017, 10, 7, 0, 14, 42), f"got {d!r}"
          assert d.tzinfo is None, "the datetime should be naive (no tzinfo)"

      def test_first_vehicle():
          """first vehicle row, with model_year as an int"""
          row = next(iter_file('data/vehicles.csv', 'Vehicle', VEHICLE_PARSER))
          assert tuple(row) == ('100-53-9824', 'Oldsmobile', 'Bravada', 1993), f"got {row!r}"
          assert isinstance(row.model_year, int), "model_year should be an int"

      def test_class_and_fields():
          """named tuple class uses class_name and the header's field names"""
          row = next(iter_file('data/vehicles.csv', 'Vehicle', VEHICLE_PARSER))
          assert type(row).__name__ == 'Vehicle', f"class is {type(row).__name__}"
          assert row._fields == ('ssn', 'vehicle_make', 'vehicle_model', 'model_year'), f"fields are {row._fields}"

      def test_header_not_yielded():
          """the header row is not yielded as data"""
          row = next(iter_file('data/personal_info.csv', 'Personal', (str,) * 5))
          assert row.ssn == '100-53-9824', f"first row was {row!r}"

      def test_row_count():
          """every file has 1000 data rows"""
          n = sum(1 for _ in iter_file('data/personal_info.csv', 'Personal', (str,) * 5))
          assert n == 1000, f"got {n} rows"

      def test_quoted_commas():
          """quoted employer names stay in one field"""
          employers = [r.employer for r in iter_file('data/employment.csv', 'Employment', (str,) * 4)]
          assert 'Kohler, Bradtke and Davis' in employers, "quoted employer names were split"
          assert len(employers) == 1000

      def test_dates_parsed():
          """update_status dates become datetime objects"""
          parser = (str, parse_date, parse_date)
          row = next(iter_file('data/update_status.csv', 'UpdateStatus', parser))
          assert row.last_updated == datetime(2017, 10, 7, 0, 14, 42), f"got {row.last_updated!r}"
          assert row.created == datetime(2016, 1, 24, 21, 19, 30), f"got {row.created!r}"

      def test_lazy():
          """iter_file returns a lazy iterator, not a list"""
          result = iter_file('data/vehicles.csv', 'Vehicle', VEHICLE_PARSER)
          assert iter(result) is result, "iter_file should return an iterator (use yield)"
    solution: |
      import csv
      from collections import namedtuple
      from datetime import datetime

      def parse_date(value, *, fmt='%Y-%m-%dT%H:%M:%SZ'):
          return datetime.strptime(value, fmt)

      def csv_parser(fname, *, include_header=False):
          with open(fname) as f:
              reader = csv.reader(f, delimiter=',', quotechar='"')
              if not include_header:
                  next(reader)
              yield from reader

      def iter_file(fname, class_name, parser):
          header = next(csv_parser(fname, include_header=True))
          nt_class = namedtuple(class_name, header)
          for row in csv_parser(fname):
              yield nt_class(*(parse_fn(value) for value, parse_fn in zip(row, parser)))
    hints:
      - "`datetime.strptime(value, '%Y-%m-%dT%H:%M:%SZ')` parses the dates; the `Z` is matched literally."
      - "Read the header with `next(csv.reader(f))` and pass that list straight to `namedtuple(class_name, header)`."
      - "`zip(row, parser)` pairs each raw string with its converter; unpack the converted values into the class with `*`."

