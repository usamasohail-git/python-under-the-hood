quiz:
  - q: What does this print?
    code: |
      grid = [[0]] * 3
      grid[0].append(1)
      print(grid)
    options:
      - "`[[0, 1], [0], [0]]`"
      - "`[[0, 1], [0, 1], [0, 1]]`"
      - "`[[0], [0], [0], 1]`"
      - A `TypeError`
    answer: 1
    explain: |
      Repetition copies **references**. `grid` holds the same inner list three times, so appending through `grid[0]` is visible in every row. Use `[[0] for _ in range(3)]` for independent rows.

  - q: What does this print?
    code: |
      l = [0, 1, 2, 3, 4, 5]
      print(l[3:-1:-1])
    options:
      - "`[3, 2, 1, 0]`"
      - "`[3, 2, 1]`"
      - "`[]`"
      - "`[3, 4]`"
    answer: 2
    explain: |
      A negative bound counts from the end, so `-1` means index `5`. The slice is equivalent to `range(3, 5, -1)`, which is empty. Use `l[3::-1]` to walk back to the start.

  - q: What does this print?
    code: |
      t = (1, 2, 3)
      print(t[:] is t, tuple(t) is t, list(t) is t)
    options:
      - "`True True False`"
      - "`False False False`"
      - "`True False False`"
      - "`False True False`"
    answer: 0
    explain: |
      Copying an immutable tuple is pointless, so `t[:]` and `tuple(t)` return the original object. `list(t)` has to build a brand-new list.

  - q: What does this print?
    code: |
      a = [[1], [2]]
      b = a.copy()
      b[0].append(9)
      b[1] = [0]
      print(a)
    options:
      - "`[[1], [2]]`"
      - "`[[1, 9], [0]]`"
      - "`[[1], [0]]`"
      - "`[[1, 9], [2]]`"
    answer: 3
    explain: |
      `copy()` is shallow: `a[0]` and `b[0]` are the same inner list, so the `append` shows up in `a`. But `b[1] = [0]` only re-binds a slot in `b`, so `a[1]` is unaffected.

  - q: What does this print?
    code: |
      a = [1, 2]
      b = a
      a += [3]
      a = a + [4]
      print(b)
    options:
      - "`[1, 2]`"
      - "`[1, 2, 3, 4]`"
      - "`[1, 2, 3]`"
      - "`[4]`"
    answer: 2
    explain: |
      `a += [3]` mutates the shared list, so `b` sees `3`. `a = a + [4]` builds a new list and re-binds only `a`, so `b` stays `[1, 2, 3]`.

  - q: What does this print?
    code: |
      l = [1, 2, 3, 4, 5]
      l[1:1] = 'xy'
      print(l)
    options:
      - "`[1, 'xy', 2, 3, 4, 5]`"
      - A `TypeError`
      - "`[1, 'x', 'y', 3, 4, 5]`"
      - "`[1, 'x', 'y', 2, 3, 4, 5]`"
    answer: 3
    explain: |
      `l[1:1]` is an empty slice just before index 1, so assigning to it **inserts**. The string is an iterable, so its characters `'x'` and `'y'` are inserted separately.

  - q: What happens here?
    code: |
      l = [1, 2, 3, 4, 5]
      l[::2] = [0, 0]
    options:
      - "`l` becomes `[0, 2, 0, 4, 5]`"
      - "A `ValueError`: the extended slice selects 3 items but only 2 were given"
      - "`l` becomes `[0, 2, 0, 4]`"
      - "`l` becomes `[0, 0]`"
    answer: 1
    explain: |
      Assignment to an extended slice is one-for-one: the right-hand side must have exactly as many items as the slice selects (`[1, 3, 5]`, three items). Only ordinary slices can grow or shrink a list.

  - q: What does this print?
    code: |
      t = 'bb', 'a', 'cc', 'd'
      print(sorted(t, key=len))
    options:
      - "`['a', 'd', 'bb', 'cc']`"
      - "`['d', 'a', 'cc', 'bb']`"
      - "`['a', 'bb', 'cc', 'd']`"
      - "`('a', 'd', 'bb', 'cc')`"
    answer: 0
    explain: |
      Sorting by length puts the 1-letter words first. Python's sort is **stable**, so items with equal keys keep their original order (`'a'` before `'d'`, `'bb'` before `'cc'`). And `sorted` always returns a list.

  - q: What does this print?
    code: |
      l = [3, 1, 2]
      l = l.sort()
      print(l)
    options:
      - "`[1, 2, 3]`"
      - "`[3, 1, 2]`"
      - "`None`"
      - An `AttributeError`
    answer: 2
    explain: |
      `list.sort()` sorts in place and returns `None`, and the assignment then re-binds `l` to that `None`. Write `l.sort()` on its own, or `l = sorted(l)`.

  - q: What does this print?
    code: |
      funcs = [lambda: i for i in range(3)]
      print([f() for f in funcs])
    options:
      - "`[0, 1, 2]`"
      - "`[2, 2, 2]`"
      - "`[0, 0, 0]`"
      - A `NameError`, because `i` doesn't exist outside the comprehension
    answer: 1
    explain: |
      Each lambda is a closure over the comprehension's single variable `i`, looked up when the lambda is **called**. By then the loop has finished and `i` is `2`. Bind the current value with a default (`lambda i=i: i`) to get `[0, 1, 2]`.

  - q: "A class defines only `__getitem__`, which returns `index * 10` for any integer and never raises. What happens with `for x in obj: ...`?"
    options:
      - "It raises `TypeError`: the object is not iterable without `__iter__`"
      - "It yields nothing, because `__len__` is missing"
      - "It loops forever: iteration only stops when `__getitem__` raises `IndexError`"
      - "It stops after 10 items"
    answer: 2
    explain: |
      Without `__iter__`, Python iterates by calling `__getitem__(0)`, `__getitem__(1)`, ... until an `IndexError` is raised. If it never is, the loop never ends.

  - q: What is the result of running this code?
    code: |
      t = ([1], 'x')
      try:
          t[0] += [2]
      except TypeError:
          print('error', t)
    options:
      - "It prints `error ([1, 2], 'x')`"
      - "It prints `error ([1], 'x')`"
      - "Nothing is printed; `t` becomes `([1, 2], 'x')`"
      - "Nothing is printed; `t` becomes `([1], 'x', 2)`"
    answer: 0
    explain: |
      `t[0] += [2]` first calls the list's `__iadd__`, which mutates it in place, and **then** tries `t[0] = result`, which fails because tuples don't support item assignment. The error is raised, but the list has already changed.

exercises:
  - id: chunked
    title: Split a sequence into chunks
    prompt: |
      Write `chunked(seq, size)` that splits any sequence into consecutive pieces of length `size` (the last piece may be shorter) and returns them as a **list**.

      Each piece must have the **same type** as `seq`: chunking a string gives strings, chunking a tuple gives tuples. If `size` is less than 1, raise `ValueError`.

      ```python
      chunked('abcdefg', 3)       # ['abc', 'def', 'g']
      chunked((1, 2, 3, 4), 2)    # [(1, 2), (3, 4)]
      chunked([], 2)              # []
      ```
    starter: |
      def chunked(seq, size):
          # your code here
          pass
    tests: |
      def test_string():
          """chunks a string into strings"""
          assert chunked('abcdefg', 3) == ['abc', 'def', 'g'], chunked('abcdefg', 3)

      def test_tuple():
          """chunks a tuple into tuples"""
          assert chunked((1, 2, 3, 4), 2) == [(1, 2), (3, 4)]

      def test_list_type():
          """chunks of a list are lists"""
          result = chunked([1, 2, 3, 4, 5], 2)
          assert result == [[1, 2], [3, 4], [5]], result
          assert all(type(c) is list for c in result)

      def test_range():
          """works with ranges too (slicing a range gives a range)"""
          result = chunked(range(5), 2)
          assert result == [range(0, 2), range(2, 4), range(4, 5)], result

      def test_empty_and_large():
          """empty input, and size larger than the sequence"""
          assert chunked([], 2) == []
          assert chunked('ab', 10) == ['ab']

      def test_bad_size():
          """size < 1 raises ValueError"""
          try:
              chunked('abc', 0)
          except ValueError:
              return
          assert False, 'expected ValueError'
    solution: |
      def chunked(seq, size):
          if size < 1:
              raise ValueError('size must be at least 1')
          return [seq[i:i + size] for i in range(0, len(seq), size)]
    hints:
      - Slicing always returns the same type as the sequence being sliced, and out-of-range bounds are clipped.
      - "`range(0, len(seq), size)` gives the start index of every chunk."

  - id: independent-grid
    title: A grid without aliases
    prompt: |
      `make_grid(rows, cols, fill)` should return a list of `rows` lists, each containing `cols` copies of `fill`. The current version has a classic bug: changing one cell changes a whole column.

      Fix it so that every row is an independent list.
    starter: |
      def make_grid(rows, cols, fill=0):
          return [[fill] * cols] * rows
    tests: |
      def test_shape():
          """has the right shape and values"""
          assert make_grid(2, 3) == [[0, 0, 0], [0, 0, 0]]
          assert make_grid(1, 2, 'x') == [['x', 'x']]

      def test_rows_independent():
          """rows are distinct objects"""
          g = make_grid(3, 2)
          assert g[0] is not g[1] and g[1] is not g[2], 'rows are the same list object'

      def test_mutation():
          """changing one cell changes only that cell"""
          g = make_grid(3, 3)
          g[0][0] = 99
          assert g == [[99, 0, 0], [0, 0, 0], [0, 0, 0]], g

      def test_empty():
          """zero rows gives an empty list"""
          assert make_grid(0, 5) == []
    solution: |
      def make_grid(rows, cols, fill=0):
          return [[fill] * cols for _ in range(rows)]
    hints:
      - "`[row] * rows` repeats a **reference** to one row. You need a new row object for each repetition."
      - A list comprehension evaluates its expression once per iteration, creating a fresh list each time.

  - id: squares-sequence
    title: A lazy sequence of squares
    prompt: |
      Write a class `Squares(n)` that behaves like the read-only sequence `0, 1, 4, 9, ..., (n-1)**2` **without storing** the values.

      It must support:

      - `len(sq)` returning `n`
      - indexing with positive and negative integers, raising `IndexError` when out of range
      - slicing (including steps and negative steps), returning a **list** of squares
      - iteration, `in` and `reversed()` (these follow automatically if the above is right)
    starter: |
      class Squares:
          def __init__(self, n):
              self._n = n

          def __len__(self):
              return self._n

          def __getitem__(self, s):
              # your code here (s is an int or a slice)
              raise IndexError('not implemented yet')
    tests: |
      def test_len():
          """len() works"""
          assert len(Squares(5)) == 5

      def test_index():
          """positive and negative indexing"""
          sq = Squares(5)
          assert (sq[0], sq[3], sq[-1], sq[-5]) == (0, 9, 16, 0)

      def test_index_error():
          """out-of-range indices raise IndexError"""
          sq = Squares(5)
          for bad in (5, 100, -6):
              try:
                  sq[bad]
              except IndexError:
                  continue
              assert False, f'sq[{bad}] should raise IndexError'

      def test_iteration():
          """iteration stops at the end"""
          assert list(Squares(5)) == [0, 1, 4, 9, 16]
          assert 9 in Squares(5) and 25 not in Squares(5)

      def test_slices():
          """slices return lists, honoring steps"""
          sq = Squares(6)
          assert sq[1:4] == [1, 4, 9], sq[1:4]
          assert sq[::2] == [0, 4, 16]
          assert sq[::-1] == [25, 16, 9, 4, 1, 0]
          assert sq[-2:] == [16, 25]
          assert sq[10:20] == []

      def test_reversed():
          """reversed() works"""
          assert list(reversed(Squares(4))) == [9, 4, 1, 0]
    solution: |
      class Squares:
          def __init__(self, n):
              self._n = n

          def __len__(self):
              return self._n

          def __getitem__(self, s):
              if isinstance(s, slice):
                  return [i ** 2 for i in range(*s.indices(self._n))]
              if s < 0:
                  s += self._n
              if s < 0 or s >= self._n:
                  raise IndexError('Squares index out of range')
              return s ** 2
    hints:
      - Check `isinstance(s, slice)` first. `range(*s.indices(len(self)))` gives exactly the positions the slice selects.
      - For an integer, add `n` to a negative index, then raise `IndexError` if it's still outside `0 .. n-1`. Without that, iteration never stops.

  - id: sort-staff
    title: Sort by several criteria
    prompt: |
      Each record is a tuple `(name, department, salary)`. Write `sort_staff(records)` that returns a **new list** ordered:

      1. by department, alphabetically;
      2. within a department, by salary, **highest first**;
      3. when salaries tie too, by name, alphabetically.

      The input must not be modified (it might be a tuple, or a list someone else is using).
    starter: |
      def sort_staff(records):
          records.sort()
          return records
    tests: |
      DATA = [
          ('Eve', 'ops', 50),
          ('Bob', 'dev', 70),
          ('Amy', 'dev', 90),
          ('Dan', 'ops', 50),
          ('Cid', 'dev', 70),
      ]

      def test_order():
          """department, then salary descending, then name"""
          expected = [
              ('Amy', 'dev', 90),
              ('Bob', 'dev', 70),
              ('Cid', 'dev', 70),
              ('Dan', 'ops', 50),
              ('Eve', 'ops', 50),
          ]
          result = sort_staff(list(DATA))
          assert result == expected, result

      def test_not_mutated():
          """the input list is left unchanged"""
          data = list(DATA)
          sort_staff(data)
          assert data == DATA, f'input was changed to {data}'

      def test_tuple_input():
          """accepts a tuple and returns a list"""
          result = sort_staff(tuple(DATA))
          assert isinstance(result, list) and result[0] == ('Amy', 'dev', 90)

      def test_empty():
          """empty input"""
          assert sort_staff([]) == []
    solution: |
      def sort_staff(records):
          return sorted(records, key=lambda r: (r[1], -r[2], r[0]))
    hints:
      - "`sorted()` accepts any iterable and returns a new list; `list.sort()` mutates (and tuples don't have it)."
      - A key that returns a tuple sorts by its first element, then the second, and so on. Negate the salary to make just that part descending.
